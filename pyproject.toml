[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openevent-sdk"
version = "0.12.0"
description = "Python SDK for OpenEvent"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.62.3",
    "protobuf>=4.25.3",
]

[project.optional-dependencies]
test = [
    "packaging",
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["build/python/openevent"]
ignore-vcs = true
