[build-system]
requires = [
    "hatchling",
    "grpcio-tools==1.62.3",
    "grpcio==1.62.3",
    "protobuf==4.25.3",
]
build-backend = "hatchling.build"

[project]
name = "openevent-sdk"
version = "0.13.0"
description = "Python SDK for OpenEvent"
requires-python = ">=3.9"
dependencies = [
    "grpcio>=1.62.3",
    "protobuf>=4.25.3",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openevent"]

[tool.hatch.build.targets.wheel.hooks.custom]
